name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        default: 'v0.1.0'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LocalHands ${{ github.ref_name }}'
          releaseBody: 'See the release notes for details.'
          releaseDraft: true
          prerelease: false

      - name: Find and upload Windows executable
        shell: pwsh
        run: |
          $exePath = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*.exe" | Select-Object -First 1
          if ($exePath) {
            $size = (Get-Item $exePath.FullName).Length / 1MB
            Write-Host "Found executable: $($exePath.FullName)"
            Write-Host "Size: $([math]::Round($size, 2)) MB"
            Copy-Item $exePath.FullName -Destination "LocalHands-windows.exe"
          } else {
            Write-Host "No .exe found, checking release directory..."
            Get-ChildItem -Path "src-tauri/target/release" -Recurse | Select-Object FullName
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Initialize Android project
        run: tauri android init

      - name: Build Android APK
        run: tauri android build --apk
        env:
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Find and display APK info
        run: |
          find src-tauri/gen/android -name "*.apk" -type f | while read apk; do
            echo "Found APK: $apk"
            size=$(stat -c%s "$apk")
            size_mb=$(echo "scale=2; $size / 1048576" | bc)
            echo "Size: ${size_mb} MB"
          done

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  create-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: windows-artifacts

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-artifacts

      - name: List artifacts
        run: |
          echo "Windows artifacts:"
          find windows-artifacts -type f -ls 2>/dev/null || echo "No Windows artifacts"
          echo ""
          echo "Android artifacts:"
          find android-artifacts -type f -ls 2>/dev/null || echo "No Android artifacts"

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # Copy Windows exe
          find windows-artifacts -name "*.exe" -exec cp {} release-assets/LocalHands-windows.exe \; 2>/dev/null || true
          find windows-artifacts -name "*.msi" -exec cp {} release-assets/LocalHands-windows.msi \; 2>/dev/null || true
          # Copy Android APK (universal or arm64)
          find android-artifacts -name "*universal*.apk" -exec cp {} release-assets/LocalHands-android.apk \; 2>/dev/null || \
          find android-artifacts -name "*arm64*.apk" -exec cp {} release-assets/LocalHands-android.apk \; 2>/dev/null || \
          find android-artifacts -name "*.apk" -exec cp {} release-assets/LocalHands-android.apk \; 2>/dev/null || true
          echo "Release assets:"
          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: LocalHands ${{ github.ref_name }}
          body: |
            ## LocalHands ${{ github.ref_name }}
            
            Local AI assistant with Grok-style UI - built with Tauri v2 + React + TypeScript.
            
            ### Downloads
            
            - **Windows**: `LocalHands-windows.exe` - Portable executable (no installation required)
            - **Android**: `LocalHands-android.apk` - Android application package
            
            ### Features
            
            - Modern Grok-style chat interface
            - Dark theme optimized for extended use
            - Cross-platform support
            - Load your own GGUF models locally
            
            ### How to Use
            
            1. Download the appropriate file for your platform
            2. **Windows**: Run the .exe file directly
            3. **Android**: Enable "Install from unknown sources" and install the APK
            4. Load your own GGUF model file when prompted
            
            ### Requirements
            
            - **Windows**: Windows 10 or later with WebView2 (usually pre-installed)
            - **Android**: Android 7.0 (API 24) or later
            
            ### Note
            
            The GGUF model is NOT included in these builds. You need to provide your own model file.
          draft: false
          prerelease: false
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
