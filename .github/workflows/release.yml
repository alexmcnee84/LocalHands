name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        id: cuda-toolkit
        with:
          cuda: '12.4.0'
          method: 'network'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Clean install dependencies
        run: |
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue
          npm install
        shell: pwsh

      - name: Install Tauri CLI via cargo
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app with CUDA
        run: cargo tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUDA_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}

      - name: Find and upload Windows executable
        shell: pwsh
        run: |
          $exePath = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*.exe" | Select-Object -First 1
          if ($exePath) {
            $size = (Get-Item $exePath.FullName).Length / 1MB
            Write-Host "Found executable: $($exePath.FullName)"
            Write-Host "Size: $([math]::Round($size, 2)) MB"
            Copy-Item $exePath.FullName -Destination "LocalHands-windows.exe"
          } else {
            Write-Host "No .exe found, checking release directory..."
            Get-ChildItem -Path "src-tauri/target/release" -Recurse | Select-Object FullName
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  # Android build temporarily disabled - cross-compilation issue with llama_cpp_sys
  # build-android:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4
  #     ... (disabled for v1.0.0 Windows-only release)

  create-release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: windows-artifacts

      - name: List artifacts
        run: |
          echo "Windows artifacts:"
          find windows-artifacts -type f -ls 2>/dev/null || echo "No Windows artifacts"

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find windows-artifacts -name "*.exe" -exec cp {} release-assets/LocalHands-windows.exe \; 2>/dev/null || true
          find windows-artifacts -name "*.msi" -exec cp {} release-assets/LocalHands-windows.msi \; 2>/dev/null || true
          echo "Release assets:"
          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: LocalHands ${{ github.ref_name }} (CUDA)
          body: |
            ## LocalHands ${{ github.ref_name }} - CUDA GPU Accelerated
            
            Local AI assistant with Grok-style UI - built with Tauri v2 + React + TypeScript.
            
            **This build includes CUDA support for NVIDIA GPUs (RTX 4060 and similar).**
            
            ### Downloads
            
            - **Windows (CUDA)**: `LocalHands-windows.exe` - GPU-accelerated build for NVIDIA GPUs
            
            ### Features
            
            - Modern Grok-style chat interface
            - Dark theme optimized for extended use
            - **CUDA GPU acceleration** for fast inference (35-45 tokens/sec on RTX 4060)
            - Load your own GGUF models locally
            
            ### How to Use
            
            1. Download `LocalHands-windows.exe`
            2. Run the .exe file directly
            3. Load your own GGUF model file when prompted
            4. Ensure you have NVIDIA drivers installed for GPU acceleration
            
            ### Requirements
            
            - **Windows**: Windows 10 or later with WebView2 (usually pre-installed)
            - **GPU**: NVIDIA GPU with CUDA support (RTX 4060 8GB recommended)
            - **Drivers**: Latest NVIDIA drivers with CUDA support
            
            ### Note
            
            The GGUF model is NOT included in these builds. You need to provide your own model file.
            For best performance on RTX 4060 8GB, use 7B models with Q4_K quantization.
          draft: false
          prerelease: false
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
